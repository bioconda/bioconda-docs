{% extends "!layout.html" %}
{%- block extrahead %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata&family=Lato&family=Raleway:wght@400;700&display=swap" rel="stylesheet">

    {% if pagename == 'index' or pagename.startswith('recipes/') %}
    <script defer src="{{ pathto('_static/vega.min.js', 1) }}"></script>
    <script defer src="{{ pathto('_static/vega-lite.min.js', 1) }}"></script>
    <script defer src="{{ pathto('_static/vega-embed.min.js', 1) }}"></script>
    {% endif %}

    <link rel="apple-touch-icon" sizes="57x57" href="{{pathto('_static/apple-icon-57x57.png', 1)}}">
    <link rel="apple-touch-icon" sizes="60x60" href="{{pathto('_static/apple-icon-60x60.png', 1)}}">
    <link rel="apple-touch-icon" sizes="72x72" href="{{pathto('_static/apple-icon-72x72.png', 1)}}">
    <link rel="apple-touch-icon" sizes="76x76" href="{{pathto('_static/apple-icon-76x76.png', 1)}}">
    <link rel="apple-touch-icon" sizes="114x114" href="{{pathto('_static/apple-icon-114x114.png', 1)}}">
    <link rel="apple-touch-icon" sizes="120x120" href="{{pathto('_static/apple-icon-120x120.png', 1)}}">
    <link rel="apple-touch-icon" sizes="144x144" href="{{pathto('_static/apple-icon-144x144.png', 1)}}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{pathto('_static/apple-icon-152x152.png', 1)}}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{pathto('_static/apple-icon-180x180.png', 1)}}">
    <link rel="icon" type="image/png" sizes="192x192"  href="{{pathto('_static/android-icon-192x192.png', 1)}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{pathto('_static/favicon-32x32.png', 1)}}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{pathto('_static/favicon-96x96.png', 1)}}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{pathto('_static/favicon-16x16.png', 1)}}">

    <link rel="manifest" href="{{pathto('_static/manifest.json', 1)}}">
    <meta name="theme-color" content="#ffffff">
    <script>
        (function() {
            const html = document.documentElement;
            function syncTheme() {
                const theme = html.getAttribute('data-theme');
                if (theme) {
                    html.setAttribute('data-bs-theme', theme);
                }
            }
            syncTheme();
            const observer = new MutationObserver(syncTheme);
            observer.observe(html, { attributes: true, attributeFilter: ['data-theme'] });
        })();
    </script>
{{ super() }}
{% endblock %}

{% block footer -%}

<script>
    let closest;
    // Get the last part of the URL after the # symbol - should match the div id to display
    let id = window.location.hash.substring(1);
    if (id) {
        let elem = document.getElementById(id);
        if (elem != null) {
            // Get the closest "details" element and open it
            closest = elem.closest("details");
            if (closest) closest.open = true;
        }
    }
</script>

    {{ super() }}
{%- endblock %}
